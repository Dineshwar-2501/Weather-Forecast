<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeatherApi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">

  <style>
    body {
      background-image: url(../WeatherImage.jpg);
      background-size: cover;
      background-repeat: no-repeat;
    }
    .text-shadow {
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }
    .glass-effect {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* wavy.css */
    .wavy-bg {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #0b0b22, #000);
      overflow: hidden;
      z-index: -1;
    }

    .wavy-bg::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background: repeating-linear-gradient(0deg,
          rgba(0, 100, 255, 0.3) 0px,
          rgba(0, 100, 255, 0.3) 1px,
          transparent 1px,
          transparent 20px);
      transform: rotate(45deg);
      animation: wave 6s linear infinite;
      opacity: 0.6;
    }

    @keyframes wave {
      from {
        transform: translateY(0) rotate(45deg);
      }

      to {
        transform: translateY(-20px) rotate(45deg);
      }
    }
  </style>
</head>

<body class="overflow-hidden">

  <!-- 🔹 Custom styled dropdown -->
  <div class="ms-1 rounded-pill position-absolute top-0 end-0 " id="custom_translate_dropdown">
    <a href="#" class="dropdown-toggle text-dark px-3 py-2 d-block shadow-lg p-3 mb-1 bg-white rounded " data-bs-toggle="dropdown">
      <small ><i class="fas fa-globe-europe text-light me-2 "></i> English</small>
    </a>

    <div class="dropdown-menu rounded">
      <a href="#" class="dropdown-item" data-lang="en">English</a>
      <a href="#" class="dropdown-item" data-lang="bn">Bangla</a>
      <a href="#" class="dropdown-item" data-lang="fr">French</a>
      <a href="#" class="dropdown-item" data-lang="es">Spanish</a>
      <a href="#" class="dropdown-item" data-lang="ar">Arabic</a>
      <a href="#" class="dropdown-item" data-lang="ta">Tamil</a>
    </div>
  </div>

  <!-- 🔹 Hidden Google Translate element -->
  <div id="google_translate_element" style="display:none;"></div>


  <div class="container w-100 d-flex place-content-center py-5 px-3 my-1 mx-auto ">
    <div class="row">
      <h1 class="text-center text-white text-shadow">🌤️ Weather Fetcher</h1>
      <div class="d-flex  flex-column justify-content-center  mt-2">
        <input type="text" class="col-12  rounded-2 border-0 w-fit mx-auto  text-left mx-lg-2  enter shadow-lg p-2  bg-white rounded-4xl" id="city"
          placeholder="City Name...">
        <ul class="suggest list-group ms-2 w-fit " id="suggestion"></ul>
        <button type="submit" id="sun" class="col-3 w-auto sm:w-50 mx-auto  mt-2  btn btn-primary fw-bold submit my-1"
          onclick="weather()">Submit</button>
      </div>
      <div class="d-flex  mx-auto glass-effect opacity-100 w-auto m-1 rounded ">
        <div><img alt="" id="icon" class="w-75 m-1"></div>
        <div class="mt-1  p-2">
          <div class="country  text-shadow-gray-300 fw-bold text-white" id="location"></div>
          <div id="status" class="text-shadow-white fw-bold text-white"></div>
        </div>
      </div>

      <div class="row justify-content-center ms-1 align-item-center opacity-100  d-flex  w-full  rounded-3xl">

        <div class=" col-12 col-lg-3  text-center shadow-lg glass-effect rounded    temperature  p-2 mx-auto my-2">
          <div class="text text-white text-shadow-white fw-bold">Temperaure</div>
          <div class="text1 fw-bold fs-2 text-white" id="tem"> </div>
        </div>
        <div class=" col-12 col-lg-3 humidity text-center shadow-lg glass-effect  rounded     p-2 mx-auto my-2">
          <div class="text  text-white text-shadow-white  fw-bold">Humidity</div>
          <div class="text1 fw-bold fs-2 text-white" id="hum"> </div>
        </div>
        <div class=" col-12 col-lg-3 condition  shadow-lg glass-effect rounded  text-center  p-2 mx-auto my-2">
          <div class="text text-white text-shadow-white  fw-bold">Condition</div>
          <div class="text1 fw-bold fs-2 text-white" id="con"> </div>
        </div>
      </div>
    </div>
  </div>










</body>
<script>
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({ pageLanguage: 'en' }, 'google_translate_element');
  }

  document.addEventListener("DOMContentLoaded", () => {
    const menu = document.getElementById("custom_translate_dropdown");

    menu.addEventListener("click", function (e) {
      if (e.target.classList.contains("dropdown-item")) {
        e.preventDefault();
        const lang = e.target.getAttribute("data-lang");

        // update <html lang="">
        document.documentElement.setAttribute("lang", lang);

        // switch Google Translate
        const select = document.querySelector(".goog-te-combo");
        if (select) {
          select.value = lang;
          select.dispatchEvent(new Event("change"));
        }
      }
    });
  });
</script>

<script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
  integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
<script>
  const weatherBackgrounds = {
    Clear: "sunny-bg.jpg",
    Clouds: "cloudy-bg.jpg",
    Rain: "rainy-bg.jpg",
    Drizzle: "drizzle-bg.jpg",
    Thunderstorm: "storm-bg.jpg",
    Snow: "snow-bg.jpg",
    Mist: "mist-bg.jpg",
    Smoke: "smoke-bg.jpg",
    Haze: "haze-bg.jpg",
    Fog: "fog-bg.jpg",
    Dust: "dust-bg.jpg",
    Sand: "sand-bg.jpg",
    Ash: "ash-bg.jpg",
    Squall: "windy-bg.jpg",
    Tornado: "tornado-bg.jpg",
  };

  let temp = document.querySelector('#tem');
  let humd = document.querySelector('#hum');
  let cond = document.querySelector('#con');
  let loca = document.querySelector('#location');
  let icon = document.querySelector('#icon');
  let status = document.querySelector('#status');



  const API_KEY = "6c61152a7dec089f1041b74769b10d3d";
  async function weather() {
    let city = document.querySelector('#city').value;
    // let city="chennai";
    let response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}`)
    let data = await response.json()
    console.log(data);
    result(data);
  }
  const sub = document.getElementById("sun")
  sub.addEventListener("click", () => {
    weather()
  })

  function result(data) {
    icon.src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`
    icon.alt = data.weather[0].description;
    status.textContent = data.weather[0].main ?? ""
    loca.textContent = `${data.name} , ${data.sys.country}`
    temp.textContent = (data.main.temp - 273.15).toFixed(1) + "°C";
    humd.textContent = data.main.humidity + "%";
    cond.textContent = data.weather[0].main;
    document.body.style.background = `url(${weatherBackgrounds[data.weather[0].main] ?? ""})`;
    document.body.style.backgroundRepeat = "no-repeat";
    document.body.style.backgroundSize = "cover";
  }


  let input = document.querySelector('.enter');
  let submit = document.querySelector('.submit');

  input.addEventListener("keypress", function (event) {
    if (event.key === "Enter") {
      event.preventDefault();
      submit.click()
    }


  })

</script>

<script type="module">
  let cities = [];

  // Load the JSON file
  fetch("./world_cities.json")
    .then(res => res.json())
    .then(data => {
      cities = data;
    });
  const inputKey = document.getElementById("city");
  const list = document.querySelector('#suggestion');

  inputKey.addEventListener("input", () => {
    const value = inputKey.value.toLowerCase()
    list.innerHTML = ""

    if (value.length > 0) {
      const macho = cities.filter(c => c.name.toLowerCase().startsWith(value)).slice(0, 10)
      macho.forEach((match) => {
        const li = document.createElement('li');
        li.textContent = match.name;
        li.className = "list-group-item"

        li.addEventListener("click", () => {
          inputKey.value = match.name
          list.innerHTML = ""
        });
        list.appendChild(li);
      })
    }
  })

</script>

</html>
